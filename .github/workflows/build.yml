name: Build BVG Craft

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check every module imports
        # Хваща липсващ файл тук, вместо като счупен .exe при потребителя
        run: >
          python -c "import pkgutil, importlib, app, app.main;
          mods = [m.name for m in pkgutil.walk_packages(app.__path__, 'app.')];
          [importlib.import_module(m) for m in mods];
          need = {'app.server.manager', 'app.server.rcon', 'app.server.events',
          'app.server.monitor', 'app.server.worldio',
          'app.ai.brain', 'app.game.events_lib', 'app.api'};
          missing = need - set(mods);
          assert not missing, f'липсват: {missing}';
          print(len(mods), 'modules OK')"

      - name: Check interface calls match the backend
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_ui_calls.py

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --noconfirm
          --name BVGCraft
          --add-data "ui;ui"
          --collect-all webview
          --hidden-import clr
          bvgcraft.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BVG Craft (последен build)
          body: "Свали BVGCraft.exe и го пусни. Настройките и сървърът се създават до него."
          files: dist/BVGCraft.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
